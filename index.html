<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#43abc4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="検索パレット" />
    <meta name="description" content="検索先をすばやく選べる、履歴とお気に入り付きの検索ランチャー" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=12" />
    <title>検索パレット</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand" aria-label="検索パレット">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>検索パレット</span>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="helpButton" type="button" aria-label="使い方">?</button>
          <button class="icon-button" id="settingsButton" type="button" aria-label="普段使う駅の設定">⚙</button>
          <button class="icon-button" id="clearButton" type="button" aria-label="お気に入り以外の履歴を削除">
            <span aria-hidden="true">♲</span>
          </button>
        </div>
      </header>

      <main>
        <section class="history-card" aria-labelledby="historyTitle">
          <div class="section-heading">
            <h1 id="historyTitle">検索履歴</h1>
          </div>
          <div class="history-list" id="historyList" aria-live="polite"></div>
        </section>

        <section class="search-panel" aria-label="検索">
          <div class="service-strip" id="serviceStrip" aria-label="検索先を選択">
            <button class="service-button is-selected" type="button" data-service="google">
              <span class="service-icon google">G</span><span>Google</span>
            </button>
            <button class="service-button" type="button" data-service="aiMode">
              <span class="service-icon ai-mode">AI</span><span>AIモード</span>
            </button>
            <button class="service-button" type="button" data-service="maps">
              <span class="service-icon maps">●</span><span>Google<br />マップ</span>
            </button>
            <button class="service-button" type="button" data-service="yahooTransit">
              <span class="service-icon yahoo-transit">Y!</span><span>Yahoo!<br />乗換</span>
            </button>
            <button class="service-button" type="button" data-service="youtube">
              <span class="service-icon youtube">▶</span><span>YouTube</span>
            </button>
            <button class="service-button" type="button" data-service="amazon">
              <span class="service-icon amazon">a</span><span>Amazon</span>
            </button>
            <button class="service-button" type="button" data-service="tabelog">
              <span class="service-icon tabelog">食</span><span>食べログ</span>
            </button>
            <button class="service-button" type="button" data-service="rakuten">
              <span class="service-icon rakuten">R</span><span>楽天レシピ</span>
            </button>
          </div>

          <form class="search-form" id="searchForm">
            <label class="sr-only" for="searchInput">検索ワードを入力</label>
            <span class="input-mark" aria-hidden="true"></span>
            <input
              id="searchInput"
              name="query"
              type="search"
              placeholder="検索ワードを入力"
              autocomplete="off"
              autocapitalize="none"
              enterkeyhint="search"
              autofocus
            />
            <button class="input-clear-button" id="inputClearButton" type="button" aria-label="入力文字をすべて削除">×</button>
            <button class="submit-button" type="submit" aria-label="検索する">検索</button>
          </form>
          <p class="selected-service" id="selectedService">検索ボタンを押すとGoogleで検索します</p>
        </section>
      </main>
    </div>

    <dialog id="helpDialog">
      <div class="dialog-body">
        <h2>使い方</h2>
        <ol>
          <li>検索ワードを入力します。</li>
          <li>使いたいサービスのボタンを押すと、すぐに検索します。</li>
          <li>キーボードの「検索」または入力欄右側の検索ボタンでは、Google検索を実行します。</li>
        </ol>
        <p>履歴の星を押すと、お気に入りとして上部に固定できます。Yahoo!乗換案内の出発駅と検索ボタンの並び順は、右上の歯車ボタンから変更できます。</p>
        <button class="dialog-close" id="closeHelpButton" type="button">閉じる</button>
      </div>
    </dialog>

    <dialog id="stationDialog">
      <form class="dialog-body" id="stationForm" method="dialog">
        <h2>普段使う駅の設定</h2>
        <p>Yahoo!乗換案内で出発駅として使用します。駅名を入力してください。</p>
        <label class="station-label" for="stationInput">出発駅</label>
        <input id="stationInput" class="station-input" type="text" placeholder="例：浜松" autocomplete="off" />
        <div class="order-heading">
          <span>検索ボタンの並び順</span>
          <button id="resetOrderButton" class="order-reset" type="button">初期順に戻す</button>
        </div>
        <div id="orderList" class="order-list" aria-label="検索ボタンの並び順"></div>
        <div class="dialog-actions">
          <button class="dialog-cancel" id="cancelStationButton" type="button">キャンセル</button>
          <button class="dialog-close" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=19" defer></script>
  </body>
</html>

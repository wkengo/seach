function pts(d,tz){const a=new Intl.DateTimeFormat('ja-JP',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),n=s=>+((a.find(x=>x.type===s)||{}).value||0);return{y:n('year'),m:n('month'),d:n('day'),h:n('hour')%24,i:n('minute')}}function off(d,tz){const p=pts(d,tz);return Math.round((Date.UTC(p.y,p.m-1,p.d,p.h,p.i)-Math.floor(d/60000)*60000)/60000)}function ol(n){const a=Math.abs(n);return`UTC${n>=0?'+':'-'}${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`}function local(d,tz){const p=pts(d,tz);return`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}T${String(p.h).padStart(2,'0')}:${String(p.i).padStart(2,'0')}`}function instant(v,tz){const [a,b]=v.split('T'),[y,m,d]=a.split('-').map(Number),[h,i]=b.split(':').map(Number),base=Date.UTC(y,m-1,d,h,i);let g=base;for(let k=0;k<3;k++)g=base-off(new Date(g),tz)*60000;return new Date(g)}
function head(t,l='',r=''){return`<header><div>${l}</div><h1>${t}</h1><div>${r}</div></header>`}function save(){localStorage.setItem('world-zones',JSON.stringify(ids));localStorage.setItem('world-home',homeId)}function diffText(z,home,d){const n=off(d,z.tz),df=n-off(d,home.tz),a=Math.abs(df);return`${ol(n)}・現在地 ${df>=0?'+':'-'}${String(Math.floor(a/60)).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`}function timeSort(a,b,d){return off(d,a.tz)-off(d,b.tz)||a.city.localeCompare(b.city,'ja')}function norm(s){return String(s).normalize('NFKC').toLocaleLowerCase('ja').replace(/\s+/g,' ').trim()}function matchingZones(){const key=norm(q),today=fixed||new Date;return zones.filter(z=>{const match=!key||norm(`${z.city} ${z.country} ${z.tz} ${z.keywords}`).includes(key);return match&&(key||(!ids.includes(z.id)&&z.id!==homeId))}).sort((a,b)=>timeSort(a,b,today))}function addChoiceHTML(z,home,today){const status=z.id===homeId?'現在地':ids.includes(z.id)?'登録済み':'＋',disabled=status==='＋'?'':' disabled';return`<button class="choice"${disabled}${status==='＋'?` data-add="${z.id}"`:''}><span><b>${z.city}</b><small>${z.country}</small><small class="offset">${diffText(z,home,today)}</small></span><strong>${status}</strong></button>`}function bindAddButtons(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ids.push(b.dataset.add);save();view='main';render()})}function updateSearchResults(){const box=document.querySelector('#search-results');if(!box)return;const home=zid(homeId),today=fixed||new Date,a=matchingZones();box.innerHTML=a.length?a.map(z=>addChoiceHTML(z,home,today)).join(''):'<p class="note">該当する地域はありません。</p>';bindAddButtons()}
function clock(z,label){const d=fixed||new Date,p=pts(d,z.tz),h=zid(homeId),n=off(d,z.tz),df=n-off(d,h.tz),week='日月火水木金土'[new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()],abbr=new Intl.DateTimeFormat('en-US',{timeZone:z.tz,timeZoneName:'short'}).formatToParts(d).find(x=>x.type==='timeZoneName').value;return`<button class="clock" data-open="${z.id}"><span><b>${label||z.city}</b><small>${label?z.city+'・'+z.country:z.country}</small><em>${df>=0?'+':'-'}${String(Math.floor(Math.abs(df)/60)).padStart(2,'0')}:${String(Math.abs(df)%60).padStart(2,'0')}</em></span><span><small>${p.y}年${p.m}月${p.d}日（${week}）</small><em>${abbr} ${ol(n)}</em><b>${String(p.h).padStart(2,'0')}:${String(p.i).padStart(2,'0')}</b></span><i>›</i></button>`}
function render(){const home=zid(homeId),list=ids.map(zid).filter(Boolean),today=fixed||new Date;if(view==='add'){app.innerHTML=head('都市の選択','<button class="round" data-back>×</button>')+`<section class="page"><div class="search-wrap"><label class="search">⌕<input id="search" autofocus placeholder="都市名・国名・英語名など" value="${esc(q)}"></label></div><p class="caption">地域を選択（UTC時差順）</p><div id="search-results"></div></section>`;bind();updateSearchResults();setTimeout(()=>{const x=document.querySelector('#search');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}});return}
if(view==='settings'){const ordered=[...zones].sort((x,y)=>timeSort(x,y,today));app.innerHTML=head('現在地の設定','<button class="round" data-back>×</button>')+`<section class="page"><p class="note">「現在地」として表示する地域を選択してください。デフォルトは東京です。</p>${ordered.map(z=>`<button class="choice ${z.id===homeId?'active':''}" data-home="${z.id}"><span><b>${z.city}</b><small>${z.country}</small><small class="offset">${diffText(z,home,today)}</small></span><strong>${z.id===homeId?'✓':''}</strong></button>`).join('')}</section>`;return bind()}
if(view==='help'){app.innerHTML=head('使い方','<button class="round" data-back>×</button>')+`<section class="page guide"><p class="guide-lead">「時差一覧」は、複数地域の時刻と、指定日時における各地域の時刻を比較するツールです。</p><ol class="guide-list"><li><b>地域を追加する</b><span>基本画面右上の「＋」を押し、都市名や国名を入力します。追加する地域の「＋」を押してください。</span></li><li><b>表示順を変更する</b><span>左上の「編集」を押し、上下の矢印で並び替えます。「✓」で完了し、「−」で地域を削除できます。</span></li><li><b>指定日時を比較する</b><span>都市のカードを押し、その都市の日時を指定して「✓」を押すと、すべての都市が対応する日時に切り替わります。</span></li><li><b>現在時刻に戻す</b><span>画面下の「現在時刻」を押すと、指定日時を解除して現在の表示へ戻ります。</span></li><li><b>現在地を変更する</b><span>右下の歯車を押し、基準にする地域を選びます。位置情報は使用せず、初期設定は東京です。</span></li></ol><p class="guide-tip"><b>時差の見方：</b>「UTC＋07:00」は協定世界時より7時間進んでいることを示します。「−02:00」は現在地より2時間遅いことを示します。</p></section>`;return bind()}

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Google検索を開いています</title>
  </head>
  <body>
    <p>Google検索を開いています。</p>
    <script>
      const query = new URLSearchParams(location.search).get("q") || "";
      location.replace(`https://www.google.com/search?client=safari&q=${encodeURIComponent(query)}`);
    </script>
  </body>
</html>
